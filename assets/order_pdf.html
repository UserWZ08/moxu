<html><head><style>
  body { color: #222; font-family: 'Microsoft YaHei'; font-size: 10pt; }
  h1 { font-size: 19pt; color: $accent; }
  h2 { font-size: 12pt; }
  td, th { padding: 5px; border: 1px solid #bbbbbb; }
  th { background: #eeeeee; }
  p { margin-top: 5px; margin-bottom: 5px; }
</style></head><body>
$top_images
<h1>$title</h1>
<p>$header_text</p>
<p>订单号：$order_id<br>状态：$status</p>
<h2>$address</h2>
<p>称呼：$customer</p>
$contact_html
<p>备注：$note</p>
<table width="100%" cellspacing="0" cellpadding="4">
  <thead><tr>
    <th width="33%">文件</th><th width="27%">打印参数</th>
    <th width="14%">页数/份数</th><th width="26%">打印机</th>
  </tr></thead>
  $file_rows
</table>
<p>文件合计：${sides}面 / ${sheets}张纸（不含订单页）</p>
<p>装订：$binding_text</p>
<h2>$total_text</h2>
$bottom_images
<p>$footer_text</p>
<p>文件提交状态请以软件订单记录和系统队列为准。</p>
</body></html>
